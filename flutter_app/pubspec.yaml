name: cookpad_egypt
description: Cookpad Egypt - Recipe sharing platform for Egyptian home cooks
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  provider: ^6.1.1
  flutter_bloc: ^8.1.3

  # Networking
  http: ^1.1.0
  dio: ^5.4.0

  # Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.1

  # Image handling
  image_picker: ^1.0.5
  cached_network_image: ^3.3.0

  # UI Components
  flutter_svg: ^2.0.9
  google_fonts: ^6.1.0
  flutter_rating_bar: ^4.0.1
  shimmer: ^3.0.0
  pull_to_refresh: ^2.0.0

  # Authentication
  flutter_secure_storage: ^9.0.0
  jwt_decoder: ^2.0.1

  # Internationalization
  intl: ^0.18.1

  # Real-time chat
  web_socket_channel: ^2.4.0

  # Utils
  equatable: ^2.0.5
  get_it: ^7.6.4
  dartz: ^0.10.1

  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.6

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/translations/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
